<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>KillOrBeKilled - Inventory</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="data/weapons.js"></script>

<script src="data/skins.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: url("assets/ui/background.png") center center / cover no-repeat;
    font-family: Arial, sans-serif;
    color: white;
}

#back {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 20;

    padding: 10px 18px;

    border: none;
    border-radius: 10px;

    background: rgba(0, 0, 0, 0.65);
    color: white;

    font-size: 18px;
    font-weight: bold;
}

#layout {
    width: 100%;
    height: 100%;

    display: flex;
}

#preview-area {
    width: 40%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}

#preview-rig {
    position: relative;

    width: 256px;
    height: 256px;
}

#character {
    position: absolute;

    width: 256px;
    height: 256px;

    left: 0;
    top: 0;

    image-rendering: pixelated;
}

#weapon {
    position: absolute;

    width: 64px;
    height: 64px;

    left: 220px;
    top: 96px;

    transform-origin: 0% 50%;

    image-rendering: pixelated;
}

#inventory {
    width: 60%;
    height: 100%;

    padding: 70px 25px 20px;

    overflow-y: auto;
}

#tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.tab {
    padding: 10px 18px;

    border: none;
    border-radius: 10px;

    background: rgba(0, 0, 0, 0.65);
    color: white;

    font-size: 18px;
    font-weight: bold;
}

.tab.active {
    background: rgba(255, 255, 255, 0.25);
}

.rarity {
    margin-bottom: 18px;
}

.rarity-title {
    margin-bottom: 8px;

    font-size: 20px;
    font-weight: bold;
}

.items {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.item {
    position: relative;

    width: 80px;
    height: 80px;

    padding: 7px;

    border-radius: 10px;

    background: rgba(0, 0, 0, 0.65);

    display: flex;
    align-items: center;
    justify-content: center;
}

.item.selected {
    outline: 3px solid white;
}

.item img {
    width: 65px;
    height: 65px;

    object-fit: contain;
    image-rendering: pixelated;
}

.level {
    position: absolute;

    right: 4px;
    bottom: 3px;

    padding: 2px 5px;

    border-radius: 5px;

    background: rgba(0, 0, 0, 0.8);

    font-size: 11px;
    font-weight: bold;
}

#popup {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(320px, 85vw);

    padding: 20px;

    border-radius: 15px;

    background: rgba(15, 15, 15, 0.95);

    display: none;

    z-index: 50;
}

#popup h2 {
    margin-bottom: 8px;
}

#popup p {
    margin-bottom: 5px;
}

#popup button {
    width: 100%;

    margin-top: 15px;
    padding: 12px;

    border: none;
    border-radius: 10px;

    font-size: 16px;
    font-weight: bold;
}

#upgrade {
    background: #555;
    color: #aaa;

    cursor: not-allowed;
}

#close-popup {
    background: #222;
    color: white;
}

@media (max-width: 700px) {

    #preview-area {
        width: 35%;
    }

    #inventory {
        width: 65%;
        padding: 60px 10px 15px;
    }

    #preview-rig {
        width: 180px;
        height: 180px;
    }

    #character {
        width: 180px;
        height: 180px;
    }

    #weapon {
        width: 64px;
        height: 64px;

        left: 150px;
        top: 58px;
    }

    .item {
        width: 65px;
        height: 65px;
    }

    .item img {
        width: 55px;
        height: 55px;
    }

    .tab {
        padding: 10px;
        font-size: 16px;
    }
}
</style>

</head>

<body>

<button id="back">← Back</button>

<div id="layout">

```
<div id="preview-area">
    <div id="preview-rig">
        <img id="character">
        <img id="weapon">
    </div>
</div>

<div id="inventory">

    <div id="tabs">
        <button class="tab active" onclick="showCategory('skins')">
            Skins
        </button>

        <button class="tab" onclick="showCategory('weapons')">
            Weapons
        </button>
    </div>

    <div id="items-container"></div>

</div>
```

</div>

<div id="popup">

```
<h2 id="popup-name">Item</h2>

<p id="popup-rarity"></p>
<p id="popup-level"></p>

<div id="popup-stats"></div>

<button id="upgrade" disabled>
    Upgrade — Locked
</button>

<button id="close-popup">
    Close
</button>
```

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

if (tg.BackButton) {
    tg.BackButton.hide();
}


/* ------------------------------------------------ */
/* RESET OLD LEVEL DATA                             */
/* ------------------------------------------------ */

localStorage.setItem("weaponLevel_pistol", "1");
localStorage.setItem("skinLevel_starter", "1");


/* ------------------------------------------------ */
/* DATA                                             */
/* ------------------------------------------------ */

const rarities = [
    "Common",
    "Uncommon",
    "Rare",
    "Epic",
    "Mythic",
    "Legendary",
    "Ultra",
    "Special"
];

let currentCategory = "skins";


/* ------------------------------------------------ */
/* LEVEL                                            */
/* ------------------------------------------------ */

function getLevel(type, id) {

    /*
        Upgrades are intentionally locked.

        Everything is currently Level 1.
    */

    return 1;
}


/* ------------------------------------------------ */
/* PREVIEW                                          */
/* ------------------------------------------------ */

function updatePreview() {

    const selectedSkin =
        localStorage.getItem("selectedSkin")
        || "assets/skins/starter.png";

    const selectedWeapon =
        localStorage.getItem("selectedWeapon")
        || "assets/weapons/pistol.png";

    document.getElementById("character").src = selectedSkin;
    document.getElementById("weapon").src = selectedWeapon;
}


/* ------------------------------------------------ */
/* CREATE ITEM                                      */
/* ------------------------------------------------ */

function createItem(type, id, data) {

    const item = document.createElement("div");

    item.className = "item";

    const level = getLevel(type, id);

    const sprite =
        data.sprite ||
        (type === "skins"
            ? "assets/skins/" + id + ".png"
            : "assets/weapons/" + id + ".png");

    item.innerHTML = `
        <img src="${sprite}">
        <div class="level">Lv.${level}</div>
    `;

    const selected =
        type === "skins"
            ? localStorage.getItem("selectedSkin") === sprite
            : localStorage.getItem("selectedWeapon") === sprite;

    if (selected) {
        item.classList.add("selected");
    }

    item.onclick = () => {

        if (type === "skins") {

            localStorage.setItem(
                "selectedSkin",
                sprite
            );

        } else {

            localStorage.setItem(
                "selectedWeapon",
                sprite
            );

        }

        updatePreview();

        showCategory(type);

        openPopup(type, id, data);
    };

    return item;
}


/* ------------------------------------------------ */
/* SHOW CATEGORY                                    */
/* ------------------------------------------------ */

function showCategory(category) {

    currentCategory = category;

    document.querySelectorAll(".tab").forEach(button => {
        button.classList.remove("active");
    });

    if (category === "skins") {
        document.querySelectorAll(".tab")[0].classList.add("active");
    } else {
        document.querySelectorAll(".tab")[1].classList.add("active");
    }

    const container =
        document.getElementById("items-container");

    container.innerHTML = "";

    const database =
        category === "skins"
            ? SKINS
            : WEAPONS;

    rarities.forEach(rarity => {

        const matchingItems =
            Object.entries(database)
                .filter(([id, data]) => data.rarity === rarity);

        if (matchingItems.length === 0) {
            return;
        }

        const rarityBox =
            document.createElement("div");

        rarityBox.className = "rarity";

        rarityBox.innerHTML = `
            <div class="rarity-title">
                ${rarity}
            </div>
        `;

        const items =
            document.createElement("div");

        items.className = "items";

        matchingItems.forEach(([id, data]) => {

            items.appendChild(
                createItem(
                    category,
                    id,
                    data
                )
            );

        });

        rarityBox.appendChild(items);

        container.appendChild(rarityBox);

    });
}


/* ------------------------------------------------ */
/* POPUP                                            */
/* ------------------------------------------------ */

function openPopup(type, id, data) {

    const popup =
        document.getElementById("popup");

    const level =
        getLevel(type, id);

    document.getElementById("popup-name").textContent =
        data.name;

    document.getElementById("popup-rarity").textContent =
        "Rarity: " + data.rarity;

    document.getElementById("popup-level").textContent =
        "Level: " + level + "/9";

    const stats =
        document.getElementById("popup-stats");

    stats.innerHTML = "";

    if (type === "weapons") {

        stats.innerHTML = `
            <p>Damage: ${data.damage}</p>
            <p>Cooldown: ${data.cooldown}s</p>
            <p>Bullets: ${data.bullets}</p>
            <p>Spread: ${data.spread}</p>
            <p>Range: ${data.range}</p>
            <p>Bullet size: ${data.bulletSize}</p>
        `;

    } else {

        stats.innerHTML = `
            <p>HP: ${data.hp}</p>
            <p>Regeneration: ${data.regeneration.amount} HP</p>
            <p>Regeneration delay: ${data.regeneration.delay}s</p>
        `;

    }

    /*
        Upgrade is deliberately locked.
        There is NO upgrade function.
    */

    const upgrade =
        document.getElementById("upgrade");

    upgrade.disabled = true;
    upgrade.textContent = "Upgrade — Locked";

    popup.style.display = "block";
}


/* ------------------------------------------------ */
/* CLOSE POPUP                                      */
/* ------------------------------------------------ */

document.getElementById("close-popup").onclick = () => {

    document.getElementById("popup").style.display =
        "none";

};


/* ------------------------------------------------ */
/* BACK                                             */
/* ------------------------------------------------ */

document.getElementById("back").onclick = () => {

    window.location.href = "index.html";

};


/* ------------------------------------------------ */
/* AIM PREVIEW                                      */
/* ------------------------------------------------ */

const rig =
    document.getElementById("preview-rig");

function aimPreview(clientX, clientY) {

    const rect =
        rig.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    const angle =
        Math.atan2(
            clientY - centerY,
            clientX - centerX
        ) * 180 / Math.PI;

    rig.style.transform =
        `rotate(${angle}deg)`;
}

document.addEventListener("mousemove", event => {

    aimPreview(
        event.clientX,
        event.clientY
    );

});

document.addEventListener("touchmove", event => {

    if (!event.touches.length) return;

    aimPreview(
        event.touches[0].clientX,
        event.touches[0].clientY
    );

}, { passive: true });


/* ------------------------------------------------ */
/* START                                            */
/* ------------------------------------------------ */

updatePreview();
showCategory("skins");

</script>

</body>
</html>
