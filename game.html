<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: black;
    touch-action: none;
}


/* =========================
   GAME AREA
========================= */

#game {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        url("assets/ui/background.png")
        center / cover no-repeat;
}


/* =========================
   GAME SCALE
========================= */

#world {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    transform:
        translate(-50%, -50%)
        scale(0.5);

    transform-origin: center;
}


/* =========================
   PLAYERS
========================= */

.player {
    position: absolute;

    width: 120px;
    height: 120px;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}

.player img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* =========================
   STATUS
========================= */

#status {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-family: Arial, sans-serif;
    font-size: 18px;

    z-index: 1000;
}


/* =========================
   JOYSTICK
========================= */

#joystick {
    position: fixed;

    left: 30px;
    bottom: 30px;

    width: 120px;
    height: 120px;

    border: 3px solid white;

    border-radius: 50%;

    z-index: 2000;

    touch-action: none;
}

#stick {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 50px;
    height: 50px;

    transform:
        translate(-50%, -50%);

    background: white;

    border-radius: 50%;
}

</style>
</head>


<body>


<div id="game">

    <div id="world">

        <div
            id="player"
            class="player"
        >
            <img
                src="assets/skins/starter.png"
            >
        </div>


        <div
            id="opponent"
            class="player"
        >
            <img
                src="assets/skins/starter.png"
            >
        </div>

    </div>

</div>


<div id="status">
    Connecting...
</div>


<div id="joystick">

    <div id="stick"></div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

if (tg.requestFullscreen) {

    setTimeout(
        () => tg.requestFullscreen(),
        500
    );

}


/* =========================
   SERVER
========================= */

const SERVER =
    "wss://brawlbaaaaalls.onrender.com/ws";

const socket =
    new WebSocket(SERVER);


/* =========================
   ELEMENTS
========================= */

const world =
    document.getElementById("world");

const playerElement =
    document.getElementById("player");

const opponentElement =
    document.getElementById("opponent");

const statusElement =
    document.getElementById("status");

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");


/* =========================
   STATE
========================= */

let myId = null;
let roomFound = false;

let inputX = 0;
let inputY = 0;

let aimAngle = 0;


/* =========================
   WEAPON
========================= */

const selectedWeapon =
    localStorage.getItem("selectedWeapon")
    || "assets/weapons/pistol.png";


/*
    Convert:

    assets/weapons/pistol.png

    into:

    pistol
*/

const weaponName =
    selectedWeapon
        .split("/")
        .pop()
        .replace(".png", "");


/* =========================
   CONNECT
========================= */

socket.onopen = () => {

    statusElement.textContent =
        "Finding opponent...";


    socket.send(
        JSON.stringify({

            type: "player_info",

            name: "Player",

            weapon: weaponName

        })
    );


    socket.send(
        JSON.stringify({

            type: "play"

        })
    );

};


/* =========================
   SERVER MESSAGES
========================= */

socket.onmessage = event => {

    let data;

    try {

        data =
            JSON.parse(
                event.data
            );

    }
    catch {

        return;

    }


    /* =====================
       CONNECTED
    ===================== */

    if (
        data.type ===
        "connected"
    ) {

        myId =
            data.player_id;

    }


    /* =====================
       WAITING
    ===================== */

    else if (
        data.type ===
        "waiting"
    ) {

        statusElement.textContent =
            "Waiting for opponent...";

    }


    /* =====================
       MATCH FOUND
    ===================== */

    else if (
        data.type ===
        "match_found"
    ) {

        roomFound = true;

        statusElement.textContent =
            "MATCH FOUND!";


        setTimeout(
            () => {

                statusElement.textContent =
                    "Move with the joystick";

            },
            1000
        );

    }


    /* =====================
       GAME STATE
    ===================== */

    else if (
        data.type ===
        "state"
    ) {

        for (
            const player of
            data.players
        ) {

            const element =
                player.id === myId
                    ? playerElement
                    : opponentElement;


            /*
                Server position is
                converted directly to
                screen position.

                #world is scaled 0.5×,
                so everything inside it
                becomes half-size.
            */

            element.style.left =
                `${player.x}px`;

            element.style.top =
                `${player.y}px`;


            if (
                player.id === myId
            ) {

                element.style.transform =
                    `translate(-50%, -50%) rotate(${player.angle}deg)`;

            }

        }

    }


    /* =====================
       OPPONENT LEFT
    ===================== */

    else if (
        data.type ===
        "opponent_left"
    ) {

        roomFound = false;

        statusElement.textContent =
            "Opponent left.";

    }

};


/* =========================
   ERRORS
========================= */

socket.onerror = () => {

    statusElement.textContent =
        "Server connection failed.";

};


socket.onclose = () => {

    statusElement.textContent =
        "Disconnected.";

};


/* =========================
   SEND INPUT
========================= */

setInterval(
    () => {

        if (
            socket.readyState !==
            WebSocket.OPEN
        ) {

            return;

        }

        if (!roomFound) {

            return;

        }


        socket.send(
            JSON.stringify({

                type: "input",

                x: inputX,
                y: inputY,

                angle: aimAngle,

                shooting: false

            })
        );

    },
    1000 / 60
);


/* =========================
   JOYSTICK
========================= */

let joystickActive = false;

const MAX_DISTANCE = 35;


function moveJoystick(touch) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        touch.clientX -
        centerX;


    let dy =
        touch.clientY -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance >
        MAX_DISTANCE
    ) {

        dx =
            dx / distance *
            MAX_DISTANCE;

        dy =
            dy / distance *
            MAX_DISTANCE;

    }


    stick.style.left =
        `calc(50% + ${dx}px)`;


    stick.style.top =
        `calc(50% + ${dy}px)`;


    inputX =
        dx / MAX_DISTANCE;

    inputY =
        dy / MAX_DISTANCE;

}


joystick.addEventListener(
    "touchstart",
    event => {

        joystickActive = true;

        moveJoystick(
            event.touches[0]
        );

    },
    {
        passive: true
    }
);


joystick.addEventListener(
    "touchmove",
    event => {

        if (!joystickActive) {
            return;
        }

        moveJoystick(
            event.touches[0]
        );

    },
    {
        passive: true
    }
);


function resetJoystick() {

    joystickActive = false;

    inputX = 0;
    inputY = 0;

    stick.style.left =
        "50%";

    stick.style.top =
        "50%";

}


joystick.addEventListener(
    "touchend",
    resetJoystick
);

joystick.addEventListener(
    "touchcancel",
    resetJoystick
);

</script>

</body>

</html>
